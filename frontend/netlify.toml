# Slangcart web frontend — Netlify build config.
# Mirrors public/_redirects so the rule survives even if Netlify's UI overrides
# auto-detection of the publish dir.
[build]
  command = "yarn build"
  publish = "build"

[[redirects]]
  from   = "/api/*"
  to     = "https://network-pay-1.emergent.host/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
